<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Tally Research Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />h

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

<style>

  , ::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {

    --bg: #f7f6f3;

    --surface: #ffffff;

    --surface2: #f0efe9;

    --border: rgba(0,0,0,0.1);

    --border2: rgba(0,0,0,0.18);

    --text: #1a1a18;

    --text2: #5a5a55;

    --text3: #9a9990;

    --accent: #1a1a18;

    --green: #3B6D11;

    --green-bg: #EAF3DE;

    --amber: #854F0B;

    --amber-bg: #FAEEDA;

    --blue: #185FA5;

    --blue-bg: #E6F1FB;

    --red: #A32D2D;

    --red-bg: #FCEBEB;

    --font-sans: 'Syne', sans-serif;

    --font-mono: 'DM Mono', monospace;

    --radius: 10px;

    --radius-lg: 14px;

  }

  @media (prefers-color-scheme: dark) {

    :root {

      --bg: #161614;

      --surface: #1f1f1c;

      --surface2: #2a2a26;

      --border: rgba(255,255,255,0.08);

      --border2: rgba(255,255,255,0.15);

      --text: #f0efe8;

      --text2: #9a9990;

      --text3: #5a5a55;

      --green-bg: #17340440; --amber-bg: #41240240; --blue-bg: #042C5340; --red-bg: #50131340;

    }

  }

  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; min-height: 100vh; }

  .page { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 12px; }

  .logo { font-size: 16px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }

  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text); }

  .config-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }

  .config-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; letter-spacing: .04em; text-transform: uppercase; }

  .config-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }

  .config-field { flex: 1; min-width: 160px; }

  .config-field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }

  .config-field input { width: 100%; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; font-family: var(--font-mono); color: var(--text); outline: none; transition: border-color .15s; }

  .config-field input:focus { border-color: var(--border2); }

  .btn { border-radius: var(--radius); padding: 8px 16px; font-size: 13px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s, background .15s; white-space: nowrap; }

  .btn-dark { background: var(--text); color: var(--bg); border: none; }

  .btn-dark:hover { opacity: .82; }

  .btn-dark:disabled { opacity: .35; cursor: not-allowed; }

  .btn-outline { background: transparent; color: var(--text); border: 0.5px solid var(--border2); }

  .btn-outline:hover { background: var(--surface2); }

  .status-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text2); }

  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }

  .pulse.live { background: #639922; animation: pulse 2s infinite; }

  .pulse.demo { background: #378ADD; }

  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }

  .new-badge { font-size: 11px; background: var(--green-bg); color: var(--green); border-radius: 20px; padding: 2px 9px; display: none; animation: pop .3s ease; }

  @keyframes pop { 0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1} }

  .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }

  .metric { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }

  .metric-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }

  .metric-val { font-size: 26px; font-weight: 600; font-family: var(--font-mono); color: var(--text); line-height: 1; }

  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 5px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }

  .section-title { font-size: 13px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }

  .count-badge { font-size: 11px; background: var(--surface2); border-radius: 20px; padding: 2px 8px; color: var(--text3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .questions-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }

  .q-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }

  .q-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 1rem; }

  .q-title { font-size: 14px; font-weight: 500; color: var(--text); flex: 1; line-height: 1.4; }

  .q-badge { font-size: 11px; color: var(--text3); background: var(--surface2); border-radius: 20px; padding: 3px 9px; white-space: nowrap; border: 0.5px solid var(--border); }

  .bar-row { margin-bottom: 9px; }

  .bar-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); margin-bottom: 5px; }

  .bar-track { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; }

  .bar-fill { height: 100%; border-radius: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }

  .nps-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

  .nps-big { font-size: 40px; font-weight: 600; font-family: var(--font-mono); line-height: 1; }

  .nps-meta { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .nps-segs { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 7px; }

  .nps-seg { display: flex; align-items: center; gap: 8px; font-size: 12px; }

  .nps-seg-name { width: 68px; color: var(--text2); }

  .nps-seg-track { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }

  .nps-seg-fill { height: 100%; border-radius: 3px; transition: width .5s; }

  .nps-seg-pct { min-width: 32px; text-align: right; color: var(--text2); }

  .open-list { display: flex; flex-direction: column; gap: 0; max-height: 180px; overflow-y: auto; }

  .open-item { font-size: 13px; color: var(--text2); padding: 9px 0; border-bottom: 0.5px solid var(--border); line-height: 1.55; display: flex; gap: 8px; }

  .open-item:last-child { border-bottom: none; }

  .open-num { font-size: 10px; font-family: var(--font-mono); color: var(--text3); padding-top: 3px; min-width: 20px; }

  .insights-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }

  .insights-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 12px; flex-wrap: wrap; }

  .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }

  .insight-card { border-radius: var(--radius); padding: 1rem; }

  .insight-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }

  .insight-body { font-size: 13px; line-height: 1.5; }

  .insight-quote { font-size: 12px; margin-top: 8px; border-left: 2px solid; padding-left: 8px; font-style: italic; opacity: .75; line-height: 1.5; }

  .pain-opps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

  .pain-opps-col h4 { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }

  .poi-item { display: flex; gap: 8px; font-size: 13px; color: var(--text2); padding: 7px 0; border-bottom: 0.5px solid var(--border); line-height: 1.45; }

  .poi-item:last-child { border-bottom: none; }

  .poi-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }

  .share-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; }

  .share-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

  .share-url { flex: 1; min-width: 200px; font-size: 12px; font-family: var(--font-mono); background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .copied { font-size: 12px; color: var(--green); display: none; align-items: center; gap: 4px; }

  .loading { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); padding: 1.5rem 0; }

  .spinner { width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--text2); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 4rem 1rem; color: var(--text3); }

  .empty i { font-size: 36px; margin-bottom: 12px; display: block; opacity: .3; }

  .empty p { font-size: 14px; line-height: 1.6; max-width: 340px; margin: 0 auto; }

  @media (max-width: 520px) {

    .pain-opps { grid-template-columns: 1fr; }

    .nps-wrap { flex-direction: column; align-items: flex-start; gap: 16px; }

  }

</style>

</head>

<body>

<div class="page">

  <div class="topbar">

    <div class="logo"><span class="logo-dot"></span> Research Dashboard</div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">

      <button class="btn btn-outline" onclick="loadDemo()"><i class="ti ti-flask" aria-hidden="true"></i> Ver demo</button>

    </div>

  </div>

  <div class="config-panel">

    <div class="config-label"><i class="ti ti-plug" aria-hidden="true"></i> Configuração Tally</div>

    <div class="config-row">

      <div class="config-field">

        <label for="formId">Form ID</label>

        <input type="text" id="formId" placeholder="ex: wMZkbP" />

      </div>

      <div class="config-field">

        <label for="apiKey">API Key</label>

        <input type="password" id="apiKey" placeholder="tally_..." />

      </div>

      <button class="btn btn-dark" id="btnConnect" onclick="connectForm()">

        <i class="ti ti-plug" aria-hidden="true"></i> Conectar

      </button>

    </div>

    <div class="status-bar">

      <span class="pulse" id="pulseEl"></span>

      <span id="statusText">Aguardando conexão…</span>

      <span class="new-badge" id="newBadge"></span>

    </div>

  </div>

  <div id="mainContent">

    <div class="empty">

      <i class="ti ti-chart-dots" aria-hidden="true"></i>

      <p>Insira o Form ID e API Key do Tally para carregar os dados, ou clique em "Ver demo" para explorar com dados simulados.</p>

    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>

let pollInterval = null;

let lastCount = 0;

let researchData = null;

const BAR_COLORS = ['#378ADD','#1D9E75','#D85A30','#BA7517','#D4537E','#7F77DD','#639922','#E24B4A'];

function setStatus(type, text) {

  const p = document.getElementById('pulseEl');

  document.getElementById('statusText').textContent = text;

  p.className = 'pulse ' + (type === 'live' ? 'live' : type === 'demo' ? 'demo' : '');

}

function showNewBadge(n) {

  const b = document.getElementById('newBadge');

  b.textContent = '+' + n + ' nova' + (n > 1 ? 's' : '') + ' resposta' + (n > 1 ? 's' : '');

  b.style.display = 'inline-block';

  setTimeout(() => { b.style.display = 'none'; }, 5000);

}

function connectForm() {

  const fid = document.getElementById('formId').value.trim();

  const key = document.getElementById('apiKey').value.trim();

  if (!fid || !key) { alert('Preencha o Form ID e a API Key.'); return; }

  setStatus('connecting', 'Conectando…');

  fetchTallyData(fid, key);

}

async function fetchTallyData(fid, key) {

  try {

    const res = await fetch('https://api.tally.so/forms/' + fid + '/submissions?limit=500', {

      headers: { Authorization: 'Bearer ' + key }

    });

    if (!res.ok) throw new Error('Erro ' + res.status + ' — verifique Form ID e API Key');

    const json = await res.json();

    const parsed = parseTally(json);

    researchData = parsed;

    const isNew = parsed.total > lastCount && lastCount > 0;

    if (isNew) showNewBadge(parsed.total - lastCount);

    lastCount = parsed.total;

    renderDashboard(parsed);

    setStatus('live', 'Ao vivo · atualizado ' + new Date().toLocaleTimeString('pt-BR'));

    if (!pollInterval) {

      const currentFid = fid, currentKey = key;

      pollInterval = setInterval(() => fetchTallyData(currentFid, currentKey), 30000);

    }

  } catch(e) {

    setStatus('off', 'Erro: ' + e.message);

    document.getElementById('mainContent').innerHTML = '<div class="empty"><i class="ti ti-alert-circle" aria-hidden="true"></i><p>' + e.message + '</p></div>';

  }

}

function parseTally(json) {

  const subs = json.submissions || [];

  const fields = {};

  subs.forEach(sub => {

    (sub.fields || []).forEach(f => {

      if (!fields[f.key]) fields[f.key] = { label: f.label, type: f.type, values: [] };

      if (f.value !== null && f.value !== undefined && f.value !== '') fields[f.key].values.push(f.value);

    });

  });

  const durations = subs.map(s => {

    if (s.submittedAt && s.createdAt) return (new Date(s.submittedAt) - new Date(s.createdAt)) / 60000;

    return null;

  }).filter(v => v !== null && v > 0 && v < 120);

  const avgTime = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : null;

  const completed = subs.filter(s => s.isCompleted !== false).length;

  const dates = subs.map(s => new Date(s.submittedAt || s.createdAt)).filter(d => !isNaN(d)).sort((a,b)=>a-b);

  return { total: subs.length, completionRate: subs.length ? Math.round(completed/subs.length*100) : 0, avgTime, firstDate: dates[0], lastDate: dates[dates.length-1], fields };

}

function fmt(d) { return d ? d.toLocaleDateString('pt-BR') : '—'; }

function renderDashboard(data) {

  const mc = document.getElementById('mainContent');

  const fieldKeys = Object.keys(data.fields);

  let html = '<div class="metrics-row">';

  html += '<div class="metric"><div class="metric-label">Respostas</div><div class="metric-val">' + data.total + '</div></div>';

  html += '<div class="metric"><div class="metric-label">Conclusão</div><div class="metric-val">' + data.completionRate + '%</div></div>';

  html += '<div class="metric"><div class="metric-label">Tempo médio</div><div class="metric-val">' + (data.avgTime != null ? data.avgTime + 'min' : '—') + '</div></div>';

  html += '<div class="metric"><div class="metric-label">Período</div><div class="metric-val" style="font-size:14px;padding-top:6px;">' + fmt(data.firstDate) + '<span style="color:var(--text3)"> → </span>' + fmt(data.lastDate) + '</div></div>';

  html += '</div>';

  html += '<div class="section-header"><div class="section-title"><i class="ti ti-layout-list" aria-hidden="true"></i> Perguntas <span class="count-badge">' + fieldKeys.length + '</span></div></div>';

  html += '<div class="questions-list">';

  fieldKeys.forEach((key, idx) => { html += renderField(data.fields[key], idx); });

  html += '</div>';

  html += '<div class="insights-panel" id="insightsPanel">';

  html += '<div class="insights-top"><div class="section-title" style="margin:0"><i class="ti ti-sparkles" aria-hidden="true"></i> Insights com IA</div>';

  html += '<button class="btn btn-dark" onclick="generateInsights()"><i class="ti ti-wand" aria-hidden="true"></i> Gerar insights</button></div>';

  html += '<div id="insightsContent"><p style="font-size:13px;color:var(--text2);">Clique em "Gerar insights" para analisar as respostas abertas e identificar temas, pontos de dor e oportunidades.</p></div></div>';

  html += '<div class="share-card"><div class="section-title"><i class="ti ti-share" aria-hidden="true"></i> Compartilhar</div>';

  const shareUrl = window.location.origin + window.location.pathname + (document.getElementById('formId').value ? '?formId=' + document.getElementById('formId').value : '');

  html += '<div class="share-row"><div class="share-url" id="shareUrlEl">' + shareUrl + '</div>';

  html += '<button class="btn btn-outline" onclick="copyShare()"><i class="ti ti-copy" aria-hidden="true"></i> Copiar</button>';

  html += '<span class="copied" id="copiedMsg"><i class="ti ti-check" aria-hidden="true"></i> Copiado!</span></div></div>';

  mc.innerHTML = html;

}

function detectType(t) {

  const s = (t || '').toUpperCase();

  if (s.includes('MULTIPLE') || s.includes('CHECKBOX') || s.includes('DROPDOWN') || s.includes('RADIO') || s.includes('SELECT')) return 'choice';

  if (s.includes('LINEAR') || s.includes('RATING') || s.includes('SCALE') || s.includes('NPS')) return 'nps';

  return 'open';

}

function renderField(field, idx) {

  const type = detectType(field.type);

  if (type === 'choice') return renderChoice(field, idx);

  if (type === 'nps') return renderNPS(field, idx);

  return renderOpen(field, idx);

}

function renderChoice(field, idx) {

  const counts = {};

  field.values.forEach(v => { const arr = Array.isArray(v) ? v : [v]; arr.forEach(a => { if (a) counts[String(a)] = (counts[String(a)] || 0) + 1; }); });

  const total = Math.max(field.values.length, 1);

  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);

  let bars = sorted.map(([opt, cnt], i) => { const pct = Math.round(cnt/total*100); return '<div class="bar-row"><div class="bar-meta"><span>' + opt + '</span><span style="font-family:var(--font-mono)">' + pct + '% (' + cnt + ')</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + BAR_COLORS[i % BAR_COLORS.length] + ';"></div></div></div>'; }).join('');

  return '<div class="q-card"><div class="q-top"><div class="q-title">' + (field.label || 'Pergunta ' + (idx+1)) + '</div><span class="q-badge">múltipla escolha</span></div>' + bars + '</div>';

}

function renderNPS(field, idx) {

  const nums = field.values.map(v => parseFloat(v)).filter(v => !isNaN(v));

  const total = Math.max(nums.length, 1);

  const promoters = nums.filter(v => v >= 9).length;

  const passives = nums.filter(v => v >= 7 && v < 9).length;

  const detractors = nums.filter(v => v < 7).length;

  const score = Math.round((promoters - detractors) / total * 100);

  const avg = nums.length ? (nums.reduce((a,b) => a+b, 0) / nums.length).toFixed(1) : '—';

  const scoreColor = score >= 50 ? '#3B6D11' : score >= 0 ? '#BA7517' : '#A32D2D';

  return '<div class="q-card"><div class="q-top"><div class="q-title">' + (field.label || 'Pergunta ' + (idx+1)) + '</div><span class="q-badge">escala</span></div><div class="nps-wrap"><div><div class="nps-big" style="color:' + scoreColor + '">' + score + '</div><div class="nps-meta">Score · média ' + avg + '</div></div><div class="nps-segs"><div class="nps-seg"><span class="nps-seg-name" style="color:#3B6D11">Promotores</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:' + Math.round(promoters/total*100) + '%;background:#639922;"></div></div><span class="nps-seg-pct" style="font-family:var(--font-mono)">' + Math.round(promoters/total*100) + '%</span></div><div class="nps-seg"><span class="nps-seg-name" style="color:#854F0B">Passivos</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:' + Math.round(passives/total*100) + '%;background:#EF9F27;"></div></div><span class="nps-seg-pct" style="font-family:var(--font-mono)">' + Math.round(passives/total*100) + '%</span></div><div class="nps-seg"><span class="nps-seg-name" style="color:#A32D2D">Detratores</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:' + Math.round(detractors/total*100) + '%;background:#E24B4A;"></div></div><span class="nps-seg-pct" style="font-family:var(--font-mono)">' + Math.round(detractors/total*100) + '%</span></div></div></div></div>';

}

function renderOpen(field, idx) {

  const items = field.values.filter(Boolean).slice(0, 25);

  const listHtml = items.map((v, i) => '<div class="open-item"><span class="open-num">' + (i+1) + '</span><span>' + String(v).slice(0, 250) + '</span></div>').join('');

  return '<div class="q-card"><div class="q-top"><div class="q-title">' + (field.label || 'Pergunta ' + (idx+1)) + '</div><span class="q-badge">texto aberto · ' + items.length + ' respostas</span></div><div class="open-list">' + (listHtml || '<p style="font-size:13px;color:var(--text2)">Sem respostas ainda.</p>') + '</div></div>';

}

async function generateInsights() {

  if (!researchData) return;

  const ic = document.getElementById('insightsContent');

  ic.innerHTML = '<div class="loading"><span class="spinner"></span> Analisando respostas com IA…</div>';

  const openTexts = Object.values(researchData.fields).filter(f => detectType(f.type) === 'open').map(f => 'Pergunta: "' + f.label + '"\nRespostas:\n' + f.values.filter(Boolean).slice(0,30).map((v,i) => (i+1) + '. ' + v).join('\n')).join('\n\n---\n\n');

  if (!openTexts.trim()) { ic.innerHTML = '<p style="font-size:13px;color:var(--text2)">Nenhuma pergunta aberta encontrada para analisar.</p>'; return; }

  try {

    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: 'Você é especialista em UX Research. Analise as respostas e retorne APENAS JSON válido (sem markdown, sem texto extra) nesta estrutura exata:\n{"themes":[{"title":"título curto","text":"1 frase","quote":"citação direta"},{"title":"...","text":"...","quote":"..."},{"title":"...","text":"...","quote":"..."}],"pain_points":[{"text":"1 frase"},{"text":"..."}],"opportunities":[{"text":"1 frase"},{"text":"..."}]}\n\nRespostas:\n' + openTexts }] }) });

    const data = await res.json();

    const raw = (data.content?.[0]?.text || '{}').replace(/```json|```/g,'').trim();

    renderInsights(JSON.parse(raw));

  } catch(e) { ic.innerHTML = '<p style="font-size:13px;color:var(--red)">Erro ao gerar insights: ' + e.message + '</p>'; }

}

function renderInsights(ins) {

  const themeColors = [{ bg: '#E6F1FB', fg: '#0C447C', border: '#185FA580' },{ bg: '#E1F5EE', fg: '#085041', border: '#1D9E7580' },{ bg: '#FAEEDA', fg: '#633806', border: '#BA751780' }];

  let html = '<div class="insights-grid">';

  (ins.themes || []).forEach((t, i) => { const c = themeColors[i % themeColors.length]; html += '<div class="insight-card" style="background:' + c.bg + ';border:0.5px solid ' + c.border + '"><div class="insight-tag" style="color:' + c.fg + '">Tema ' + (i+1) + '</div><div class="insight-body" style="color:' + c.fg + '"><strong>' + (t.title||'') + '</strong> — ' + (t.text||'') + '</div>' + (t.quote ? '<div class="insight-quote" style="color:' + c.fg + ';border-color:' + c.fg + '">"' + t.quote + '"</div>' : '') + '</div>'; });

  html += '</div><div class="pain-opps"><div class="pain-opps-col"><h4><i class="ti ti-alert-circle" style="color:var(--red)" aria-hidden="true"></i> Pontos de dor</h4>';

  (ins.pain_points || []).forEach(p => { html += '<div class="poi-item"><i class="ti ti-minus poi-icon" style="color:var(--red)" aria-hidden="true"></i>' + p.text + '</div>'; });

  html += '</div><div class="pain-opps-col"><h4><i class="ti ti-bulb" style="color:var(--green)" aria-hidden="true"></i> Oportunidades</h4>';

  (ins.opportunities || []).forEach(o => { html += '<div class="poi-item"><i class="ti ti-plus poi-icon" style="color:var(--green)" aria-hidden="true"></i>' + o.text + '</div>'; });

  html += '</div></div>';

  document.getElementById('insightsContent').innerHTML = html;

}

function copyShare() {

}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Research Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.18);
  --text:#1a1a18;--text2:#5a5a55;--text3:#9a9990;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --sans:'Syne',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--rl:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#161614;--surface:#1f1f1c;--surface2:#2a2a26;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
    --text:#f0efe8;--text2:#9a9990;--text3:#5a5a55;
    --green-bg:#17340440;--amber-bg:#41240240;--blue-bg:#042C5340;--red-bg:#50131340;
  }
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh}
.page{max-width:880px;margin:0 auto;padding:2rem 1.5rem 5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:1.25rem;border-bottom:.5px solid var(--border);margin-bottom:1.25rem;flex-wrap:wrap;gap:12px}
.logo{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--text)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:var(--r);padding:7px 14px;font-size:13px;font-weight:500;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s,background .15s;white-space:nowrap;border:.5px solid var(--border2);background:transparent;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn-solid{background:var(--text);color:var(--bg);border-color:transparent}
.btn-solid:hover{opacity:.82}
.config{background:var(--surface2);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:1.25rem}
.config-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.cf{flex:1;min-width:150px}
.cf label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.cf input{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:8px 12px;font-size:13px;font-family:var(--mono);color:var(--text);outline:none}
.status-bar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text2)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.pulse.live{background:#639922;animation:blink 2s infinite}
.pulse.demo{background:#378ADD}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.new-badge{font-size:11px;background:var(--green-bg);color:var(--green);border-radius:20px;padding:2px 9px;display:none;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.alert-bar{font-size:12px;padding:8px 12px;border-radius:var(--r);margin-bottom:1rem;display:none;align-items:center;gap:8px;background:var(--amber-bg);color:#633806;border:.5px solid #EF9F2780}
.section{margin-bottom:1.5rem}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.st{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mc{background:var(--surface2);border-radius:var(--r);padding:.9rem 1rem}
.mc-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.mc-val{font-size:24px;font-weight:500;color:var(--text);font-family:var(--mono);line-height:1}
.mc-sub{font-size:11px;color:var(--text3);margin-top:4px}
.deadline-bar{background:var(--surface2);border-radius:var(--r);padding:.9rem 1rem;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:10px}
.dl-label{font-size:12px;color:var(--text2);white-space:nowrap}
.dl-track{flex:1;min-width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.dl-fill{height:100%;background:#378ADD;border-radius:3px}
.dl-days{font-size:13px;font-weight:500;color:var(--text);font-family:var(--mono);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}
.tab{font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;font-family:var(--sans)}
.tab.active{background:var(--text);color:var(--bg);border-color:transparent}
.tab-panel{display:none}
.tab-panel.active{display:block}
.q-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:10px}
.q-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:.9rem}
.q-title{font-size:13px;font-weight:500;color:var(--text);flex:1;line-height:1.4}
.q-badge{font-size:11px;color:var(--text3);background:var(--surface2);border-radius:20px;padding:3px 9px;white-space:nowrap;border:.5px solid var(--border);flex-shrink:0}
.bar-row{margin-bottom:8px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}
.bar-dom{font-weight:500;color:var(--text)}
.bar-track{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.nps-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.nps-big{font-size:38px;font-weight:500;font-family:var(--mono);line-height:1}
.nps-sub{font-size:11px;color:var(--text3);margin-top:4px}
.nps-segs{flex:1;min-width:160px}
.nps-seg{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.nps-seg-name{width:64px;color:var(--text2)}
.nps-seg-track{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.nps-seg-fill{height:100%;border-radius:3px}
.nps-seg-pct{min-width:30px;text-align:right;color:var(--text2);font-family:var(--mono);font-size:11px}
.open-list{max-height:160px;overflow-y:auto}
.open-item{font-size:13px;color:var(--text2);padding:8px 0;border-bottom:.5px solid var(--border);line-height:1.5;display:flex;gap:8px}
.open-item:last-child{border-bottom:none}
.open-num{font-size:10px;font-family:var(--mono);color:var(--text3);padding-top:2px;min-width:18px}
.note-field{width:100%;font-size:12px;color:var(--text2);background:transparent;border:none;border-top:.5px solid var(--border);padding:6px 0 0;margin-top:8px;resize:none;outline:none;font-family:var(--sans)}
.note-field::placeholder{color:var(--text3)}
.matrix-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem}
.matrix-hint{font-size:12px;color:var(--text2);margin-bottom:.75rem}
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:var(--r);overflow:hidden}
.mcell{background:var(--surface);padding:1rem;min-height:90px}
.mcell.critical{background:var(--red-bg)}
.mcell.watch{background:var(--amber-bg)}
.mcell.monitor{background:var(--blue-bg)}
.mcell.ok{background:var(--green-bg)}
.mcell-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.mcell.critical .mcell-label{color:var(--red)}
.mcell.watch .mcell-label{color:var(--amber)}
.mcell.monitor .mcell-label{color:var(--blue)}
.mcell.ok .mcell-label{color:var(--green)}
.mtag{font-size:12px;border-radius:20px;padding:3px 10px;display:inline-block;margin:3px 2px;border:.5px solid var(--border)}
.mtag.critical{background:var(--red-bg);color:#791F1F;border-color:#F0959580}
.mtag.watch{background:var(--amber-bg);color:#633806;border-color:#FAC77580}
.mtag.monitor{background:var(--blue-bg);color:#0C447C;border-color:#85B7EB80}
.mtag.ok{background:var(--green-bg);color:#27500A;border-color:#C0DD9780}
.matrix-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px}
.clusters-list{display:flex;flex-direction:column;gap:10px}
.cluster-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem}
.cluster-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.cluster-name{font-size:13px;font-weight:500;color:var(--text)}
.cluster-meta{display:flex;align-items:center;gap:8px}
.cluster-count{font-size:12px;color:var(--text2);font-family:var(--mono)}
.sent-badge{font-size:11px;border-radius:20px;padding:2px 9px;font-weight:500}
.sent-pos{background:var(--green-bg);color:var(--green)}
.sent-neg{background:var(--red-bg);color:var(--red)}
.sent-neu{background:var(--surface2);color:var(--text2)}
.cluster-quotes{font-size:12px;color:var(--text2);line-height:1.55}
.cq{padding:5px 0;border-bottom:.5px solid var(--border);display:flex;gap:6px}
.cq:last-child{border-bottom:none}
.cq-mark{color:var(--text3);font-size:14px;line-height:1}
.timeline-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem}
.insights-panel{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem}
.insights-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;gap:12px;flex-wrap:wrap}
.tldr{background:var(--surface2);border-radius:var(--r);padding:.9rem 1rem;font-size:13px;color:var(--text);line-height:1.6;margin-bottom:1rem;border-left:2px solid var(--border2)}
.findings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:1rem}
.fc{border-radius:var(--r);padding:.9rem}
.fc-tag{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fc-body{font-size:13px;line-height:1.5}
.fc-quote{font-size:12px;margin-top:7px;border-left:2px solid;padding-left:8px;font-style:italic;opacity:.75;line-height:1.5}
.recs-list{margin-bottom:1rem}
.rec-item{display:flex;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border);align-items:flex-start}
.rec-item:last-child{border-bottom:none}
.rec-prio{font-size:11px;border-radius:20px;padding:2px 9px;font-weight:500;white-space:nowrap;flex-shrink:0;margin-top:1px}
.p1{background:var(--red-bg);color:var(--red)}
.p2{background:var(--amber-bg);color:var(--amber)}
.p3{background:var(--green-bg);color:var(--green)}
.rec-text{font-size:13px;color:var(--text);line-height:1.5}
.gaps-list{font-size:13px;color:var(--text2);line-height:1.8;padding-left:16px}
.share-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-top:1rem}
.share-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:.75rem}
.share-url{flex:1;min-width:160px;font-size:12px;font-family:var(--mono);background:var(--surface2);border:.5px solid var(--border);border-radius:var(--r);padding:7px 10px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copied{font-size:12px;color:var(--green);display:none;align-items:center;gap:4px}
.loading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);padding:1.5rem 0}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--text2);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty i{font-size:32px;margin-bottom:12px;display:block;opacity:.3}
.empty p{font-size:13px;line-height:1.6;max-width:320px;margin:0 auto}
</style>
</head>
<body>
<div class="page">
<div class="topbar">
  <div class="logo"><span class="logo-dot"></span>Research Dashboard</div>
  <div class="actions">
    <button class="btn" id="btnPresent" onclick="togglePresentation()"><i class="ti ti-presentation" aria-hidden="true"></i> Apresentar</button>
    <button class="btn" id="btnCopyMd" style="display:none" onclick="copyMarkdown()"><i class="ti ti-markdown" aria-hidden="true"></i> Exportar</button>
  </div>
</div>
<div id="configBlock">
  <div class="config">
    <div class="config-row">
      <div class="cf"><label for="formId">Form ID do Tally</label><input type="text" id="formId" value="dWvNQo"/></div>
      <div class="cf"><label for="apiKey">API Key</label><input type="password" id="apiKey" value="tly-uTrXlk7sp6iizS3uRyCdVVQDvo7BZxy7"/></div>
      <button class="btn btn-solid" onclick="connectForm()"><i class="ti ti-plug" aria-hidden="true"></i> Conectar</button>
    </div>
    <div class="status-bar">
      <span class="pulse" id="pulseEl"></span>
      <span id="statusText">Clique em Conectar para carregar os dados</span>
      <span class="new-badge" id="newBadge"></span>
    </div>
  </div>
</div>
<div id="alertBlock" class="alert-bar" role="alert"></div>
<div id="mainContent">
  <div class="empty">
    <i class="ti ti-chart-dots-3" aria-hidden="true"></i>
    <p>Clique em <strong>Conectar</strong> para carregar os dados do formulário.</p>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let pollInterval=null,lastCount=0,researchData=null,presentationMode=false,timelineChart=null;
const BC=['#378ADD','#1D9E75','#D85A30','#BA7517','#D4537E','#7F77DD','#639922','#E24B4A'];
function setStatus(t,txt){
  document.getElementById('pulseEl').className='pulse '+(t==='live'?'live':t==='demo'?'demo':'');
  document.getElementById('statusText').textContent=txt;
}
function showAlert(msg){
  const el=document.getElementById('alertBlock');
  el.innerHTML='<i class="ti ti-alert-triangle" aria-hidden="true"></i>'+msg;
  el.style.display='flex';
}
function hideAlert(){document.getElementById('alertBlock').style.display='none';}
function showNewBadge(n){
  const b=document.getElementById('newBadge');
  b.textContent='+'+n+' nova'+(n>1?'s':'')+' resposta'+(n>1?'s':'');
  b.style.display='inline-block';
  setTimeout(()=>{b.style.display='none';},5000);
}
function connectForm(){
  const fid=document.getElementById('formId').value.trim();
  const key=document.getElementById('apiKey').value.trim();
  if(!fid||!key){alert('Preencha o Form ID e a API Key.');return;}
  setStatus('loading','Conectando…');
  fetchTallyData(fid,key);
}
async function fetchTallyData(fid,key){
  try{
    const res=await fetch('https://api.tally.so/forms/'+fid+'/submissions?limit=500',{
      headers:{Authorization:'Bearer '+key}
    });
    if(!res.ok)throw new Error('Erro '+res.status+' — verifique Form ID e API Key');
    const json=await res.json();
    const parsed=parseTally(json);
    researchData=parsed;
    const isNew=parsed.total>lastCount&&lastCount>0;
    if(isNew)showNewBadge(parsed.total-lastCount);
    lastCount=parsed.total;
    checkQuality(parsed);
    renderDashboard(parsed);
    setStatus('live','Ao vivo · atualizado '+new Date().toLocaleTimeString('pt-BR'));
    if(!pollInterval){
      const cf=fid,ck=key;
      pollInterval=setInterval(()=>fetchTallyData(cf,ck),30000);
    }
  }catch(e){
    setStatus('','Erro: '+e.message);
    document.getElementById('mainContent').innerHTML='<div class="empty"><i class="ti ti-alert-circle" aria-hidden="true"></i><p>'+e.message+'</p></div>';
  }
}
function parseTally(json){
  const subs=json.submissions||[];
  const fields={};
  subs.forEach(sub=>{
    (sub.fields||[]).forEach(f=>{
      if(!fields[f.key])fields[f.key]={label:f.label,type:f.type,values:[]};
      if(f.value!==null&&f.value!==undefined&&f.value!=='')fields[f.key].values.push(f.value);
    });
  });
  const durations=subs.map(s=>{
    if(s.submittedAt&&s.createdAt)return(new Date(s.submittedAt)-new Date(s.createdAt))/60000;
    return null;
  }).filter(v=>v!==null&&v>0&&v<120);
  const avgTime=durations.length?Math.round(durations.reduce((a,b)=>a+b,0)/durations.length):null;
  const veryFast=durations.filter(v=>v<1).length;
  const completed=subs.filter(s=>s.isCompleted!==false).length;
  const dates=subs.map(s=>new Date(s.submittedAt||s.createdAt)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
  const byDay={};
  dates.forEach(d=>{const k=d.toISOString().slice(0,10);byDay[k]=(byDay[k]||0)+1;});
  return{total:subs.length,completionRate:subs.length?Math.round(completed/subs.length*100):0,avgTime,veryFast,firstDate:dates[0],lastDate:dates[dates.length-1],fields,byDay};
}
function checkQuality(d){
  hideAlert();
  if(d.completionRate<70)showAlert('Taxa de conclusão baixa ('+d.completionRate+'%) — considere revisar o formulário.');
  else if(d.veryFast>2)showAlert(d.veryFast+' respostas em menos de 1 minuto — possíveis dados de baixa qualidade.');
}
function detectType(t){
  const s=(t||''). toUpperCase();
  if(s.includes('MULTIPLE')||s.includes('CHECKBOX')||s.includes('DROPDOWN')||s.includes('RADIO')||s.includes('SELECT'))return'choice';
  if(s.includes('LINEAR')||s.includes('RATING')||s.includes('SCALE')||s.includes('NPS'))return'nps';
  return'open';
}
function fmt(d){return d?d.toLocaleDateString('pt-BR'):'—';}
function daysUntil(ds){return Math.max(0,Math.ceil((new Date(ds)-new Date())/86400000));}
function renderDashboard(data){
  const mc=document.getElementById('mainContent');
  const daysLeft=daysUntil('2025-06-10');
  const elapsed=Math.min(100,Math.round((1-daysLeft/40)*100));
  let h='';
  h+='<div class="section"><div class="metrics-grid">';
  h+='<div class="mc"><div class="mc-label">Respostas</div><div class="mc-val">'+data.total+'</div><div class="mc-sub">coletadas até agora</div></div>';
  h+='<div class="mc"><div class="mc-label">Conclusão</div><div class="mc-val">'+data.completionRate+'%</div><div class="mc-sub">'+(data.completionRate>=70?'qualidade ok':'abaixo de 70%')+'</div></div>';
  h+='<div class="mc"><div class="mc-label">Tempo médio</div><div class="mc-val">'+(data.avgTime!=null?data.avgTime+'min':'—')+'</div><div class="mc-sub">por resposta</div></div>';
  h+='<div class="mc"><div class="mc-label">Período</div><div class="mc-val" style="font-size:13px;padding-top:7px">'+fmt(data.firstDate)+'</div><div class="mc-sub">→ '+fmt(data.lastDate)+'</div></div>';
  h+='</div>';
  h+='<div class="deadline-bar"><span class="dl-label"><i class="ti ti-calendar-event" style="font-size:14px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>Encerra 10/06</span><div class="dl-track"><div class="dl-fill" style="width:'+elapsed+'%"></div></div><span class="dl-days">'+daysLeft+' dias restantes</span></div></div>';
  h+='<div class="section"><div class="sh"><div class="st"><i class="ti ti-layout-grid" aria-hidden="true"></i>Mapa de severidade</div></div>';
  h+='<div class="matrix-wrap"><p class="matrix-hint">Impacto × Frequência — clique em Gerar síntese para popular.</p>';
  h+='<div class="matrix-grid">';
  h+='<div class="mcell watch"><div class="mcell-label">Alto impacto · baixa freq.</div><div id="m-watch"></div></div>';
  h+='<div class="mcell critical"><div class="mcell-label">⚠ Crítico — prioridade máxima</div><div id="m-critical"></div></div>';
  h+='<div class="mcell ok"><div class="mcell-label">Baixo impacto · baixa freq.</div><div id="m-ok"></div></div>';
  h+='<div class="mcell monitor"><div class="mcell-label">Monitorar — alta frequência</div><div id="m-monitor"></div></div>';
  h+='</div><div class="matrix-axis"><span>← Impacto menor</span><span>Impacto maior →</span></div></div></div>';
  h+='<div class="section"><div class="sh"><div class="st"><i class="ti ti-list-details" aria-hidden="true"></i>Perguntas</div></div>';
  h+='<div class="tabs"><button class="tab active" onclick="switchTab(&apos;all&apos;,this)">Todas</button><button class="tab" onclick="switchTab(&apos;choice&apos;,this)">Escolha múltipla</button><button class="tab" onclick="switchTab(&apos;nps&apos;,this)">Escalas</button><button class="tab" onclick="switchTab(&apos;open&apos;,this)">Abertas</button></div>';
  h+='<div id="qAll" class="tab-panel active">';Object.entries(data.fields).forEach(([k,f],i)=>{h+=renderField(f,i);});h+='</div>';
  h+='<div id="qChoice" class="tab-panel">';Object.entries(data.fields).filter(([k,f])=>detectType(f.type)==='choice').forEach(([k,f],i)=>{h+=renderField(f,i);});h+='</div>';
  h+='<div id="qNps" class="tab-panel">';Object.entries(data.fields).filter(([k,f])=>detectType(f.type)==='nps').forEach(([k,f],i)=>{h+=renderField(f,i);});h+='</div>';
  h+='<div id="qOpen" class="tab-panel">';Object.entries(data.fields).filter(([k,f])=>detectType(f.type)==='open').forEach(([k,f],i)=>{h+=renderField(f,i);});h+='</div></div>';
  h+='<div class="section"><div class="sh"><div class="st"><i class="ti ti-tag" aria-hidden="true"></i>Clusters temáticos</div></div>';
  h+='<div class="clusters-list" id="clustersList"><p style="font-size:13px;color:var(--text2)">Clique em Gerar síntese para agrupar as respostas por tema.</p></div></div>';
  h+='<div class="section"><div class="sh"><div class="st"><i class="ti ti-chart-area" aria-hidden="true"></i>Volume por dia</div></div>';
  h+='<div class="timeline-wrap"><div style="position:relative;height:140px"><canvas id="tlChart" role="img" aria-label="Volume de respostas por dia"></canvas></div></div></div>';
  h+='<div class="section"><div class="insights-panel"><div class="insights-top"><div class="st" style="margin:0"><i class="ti ti-sparkles" aria-hidden="true"></i>Síntese executiva com IA</div>';
  h+='<button class="btn btn-solid" onclick="generateInsights()"><i class="ti ti-wand" aria-hidden="true"></i> Gerar síntese</button></div>';
  h+='<div id="insightsContent"><p style="font-size:13px;color:var(--text2)">Clique em Gerar síntese para obter TL;DR, achados, recomendações, lacunas e próximos passos.</p></div></div></div>';
  h+='<div class="share-card"><div class="st"><i class="ti ti-share" aria-hidden="true"></i>Compartilhar</div>';
  h+='<div class="share-row"><div class="share-url" id="shareUrlEl">'+window.location.href+'</div>';
  h+='<button class="btn" onclick="copyShare()"><i class="ti ti-copy" aria-hidden="true"></i> Copiar link</button>';
  h+='<button class="btn" id="btnCopyMd2" style="display:none" onclick="copyMarkdown()"><i class="ti ti-markdown" aria-hidden="true"></i> Copiar síntese</button>';
  h+='<span class="copied" id="copiedMsg"><i class="ti ti-check" aria-hidden="true"></i> Copiado!</span></div></div>';
  mc.innerHTML=h;
  renderTimeline(data.byDay);
}
function renderField(f,i){
  const t=detectType(f.type);
  if(t==='choice')return renderChoice(f,i);
  if(t==='nps')return renderNPS(f,i);
  return renderOpen(f,i);
}
function renderChoice(f,i){
  const c={};
  f.values.forEach(v=>{(Array.isArray(v)?v:[v]).forEach(a=>{if(a)c[String(a)]=(c[String(a)]||0)+1;});});
  const total=Math.max(f.values.length,1);
  const sorted=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const dom=sorted[0]?sorted[0][0]:null;
  const bars=sorted.map(([opt,cnt],idx)=>{
    const pct=Math.round(cnt/total*100);
    const isDom=opt===dom&&pct>40;
    return'<div class="bar-row"><div class="bar-meta"><span class="'+(isDom?'bar-dom':'')+'">'+ opt+(isDom?' ★':'')+' </span><span style="font-family:var(--mono)">'+pct+'% ('+cnt+')</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+BC[idx%BC.length]+'"></div></div></div>';
  }).join('');
  return'<div class="q-card"><div class="q-top"><div class="q-title">'+(f.label||'Pergunta '+(i+1))+'</div><span class="q-badge">múltipla escolha</span></div>'+bars+'<textarea class="note-field" rows="1" placeholder="Adicionar anotação…"></textarea></div>';
}
function renderNPS(f,i){
  const nums=f.values.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  const total=Math.max(nums.length,1);
  const pr=nums.filter(v=>v>=9).length;
  const pa=nums.filter(v=>v>=7&&v<9).length;
  const de=nums.filter(v=>v<7).length;
  const score=Math.round((pr-de)/total*100);
  const avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1):'—';
  const sc=score>=50?'#3B6D11':score>=0?'#BA7517':'#A32D2D';
  const bm=score>=50?'acima da média SaaS B2B':score>=20?'na média SaaS B2B':'abaixo da média SaaS B2B';
  return'<div class="q-card"><div class="q-top"><div class="q-title">'+(f.label||'Pergunta '+(i+1))+'</div><span class="q-badge">escala</span></div><div class="nps-wrap"><div><div class="nps-big" style="color:'+sc+'">'+score+'</div><div class="nps-sub">Score · média '+avg+'</div><div class="nps-sub">'+bm+'</div></div><div class="nps-segs"><div class="nps-seg"><span class="nps-seg-name" style="color:#3B6D11">Promotores</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:'+Math.round(pr/total*100)+'%;background:#639922"></div></div><span class="nps-seg-pct">'+Math.round(pr/total*100)+'%</span></div><div class="nps-seg"><span class="nps-seg-name" style="color:#854F0B">Passivos</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:'+Math.round(pa/total*100)+'%;background:#EF9F27"></div></div><span class="nps-seg-pct">'+Math.round(pa/total*100)+'%</span></div><div class="nps-seg"><span class="nps-seg-name" style="color:#A32D2D">Detratores</span><div class="nps-seg-track"><div class="nps-seg-fill" style="width:'+Math.round(de/total*100)+'%;background:#E24B4A"></div></div><span class="nps-seg-pct">'+Math.round(de/total*100)+'%</span></div></div></div><textarea class="note-field" rows="1" placeholder="Adicionar anotação…"></textarea></div>';
}
function renderOpen(f,i){
  const items=f.values.filter(Boolean).slice(0,20);
  const list=items.map((v,j)=>'<div class="open-item"><span class="open-num">'+(j+1)+'</span><span>'+String(v).slice(0,200)+'</span></div>').join('');
  return'<div class="q-card"><div class="q-top"><div class="q-title">'+(f.label||'Pergunta '+(i+1))+'</div><span class="q-badge">texto aberto · '+items.length+' respostas</span></div><div class="open-list">'+(list||'<p style="font-size:13px;color:var(--text2)">Sem respostas ainda.</p>')+'</div><textarea class="note-field" rows="1" placeholder="Adicionar anotação…"></textarea></div>';
}
function renderTimeline(byDay){
  const keys=Object.keys(byDay).sort();
  if(!keys.length)return;
  const ctx=document.getElementById('tlChart');
  if(!ctx)return;
  if(timelineChart)timelineChart.destroy();
  timelineChart=new Chart(ctx,{type:'line',data:{labels:keys.map(k=>{const d=new Date(k+'T12:00:00');return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}),datasets:[{label:'Respostas',data:keys.map(k=>byDay[k]),fill:true,borderColor:'#378ADD',backgroundColor:'rgba(55,138,221,0.1)',tension:.4,pointRadius:3,pointBackgroundColor:'#378ADD',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:11},maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:{grid:{color:'rgba(128,128,128,0.1)'},ticks:{font:{size:11},stepSize:1},beginAtZero:true}}}});
}
function switchTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById({all:'qAll',choice:'qChoice',nps:'qNps',open:'qOpen'}[id])?.classList.add('active');
  btn.classList.add('active');
}
async function generateInsights(){
  if(!researchData)return;
  const ic=document.getElementById('insightsContent');
  ic.innerHTML='<div class="loading"><span class="spinner"></span> Analisando com IA…</div>';
  const openTexts=Object.values(researchData.fields).filter(f=>detectType(f.type)==='open').map(f=>'Pergunta: "'+f.label+'"\nRespostas:\n'+f.values.filter(Boolean).slice(0,30).map((v,i)=>(i+1)+'. '+v).join('\n')).join('\n\n---\n\n');
  const choiceTexts=Object.values(researchData.fields).filter(f=>detectType(f.type)==='choice').map(f=>{const c={};f.values.forEach(v=>{(Array.isArray(v)?v:[v]).forEach(x=>{if(x)c[x]=(c[x]||0)+1;});});return'Pergunta: "'+f.label+'"\n'+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+': '+v).join(', ');}).join('\n');
  if(!openTexts.trim()&&!choiceTexts.trim()){ic.innerHTML='<p style="font-size:13px;color:var(--text2)">Sem dados suficientes.</p>';return;}
  const schema='{"tldr":"2 frases","findings":[{"title":"t","text":"f","quote":"q","color":"blue"}],"recommendations":[{"priority":"P1","text":"a"}],"gaps":["g"],"next_steps":["p"],"clusters":[{"name":"tema","count":3,"sentiment":"positive","quotes":["q"]}],"matrix":{"critical":["c"],"watch":["w"],"monitor":["m"],"ok":["o"]}}';
  const prompt='Você é um UX Researcher sênior. Analise os dados e retorne APENAS JSON válido com esta estrutura: '+schema+'\n\nRespostas abertas:\n'+(openTexts||'(nenhuma)')+'\n\nDados quantitativos:\n'+(choiceTexts||'(nenhum)');
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const raw=(data.content&&data.content[0]&&data.content[0].text)||'{}';
    const ins=JSON.parse(raw.trim());
    renderInsights(ins);renderClusters(ins.clusters||[]);renderMatrix(ins.matrix||{});
    window._lastInsights=ins;
  }catch(e){
    ic.innerHTML='<p style="font-size:13px;color:var(--red)">Erro: '+e.message+'</p>';
  }
}
function renderInsights(ins){
  const cm={blue:{bg:'#E6F1FB',fg:'#0C447C',bd:'#185FA580'},teal:{bg:'#E1F5EE',fg:'#085041',bd:'#1D9E7580'},amber:{bg:'#FAEEDA',fg:'#633806',bd:'#BA751780'}};
  let h='';
  if(ins.tldr)h+='<div class="tldr">'+ins.tldr+'</div>';
  if(ins.findings&&ins.findings.length){h+='<div class="st" style="margin-bottom:8px"><i class="ti ti-bulb" aria-hidden="true"></i> Principais achados</div><div class="findings-grid">';ins.findings.forEach(function(f,i){const c=cm[f.color]||cm.blue;h+='<div class="fc" style="background:'+c.bg+';border:.5px solid '+c.bd+'">';h+='<div class="fc-tag" style="color:'+c.fg+'">Achado '+(i+1)+'</div>';h+='<div class="fc-body" style="color:'+c.fg+'"><strong>'+f.title+'</strong> — '+f.text+'</div>';if(f.quote)h+='<div class="fc-quote" style="color:'+c.fg+';border-color:'+c.fg+'">"+f.quote+"</div>';h+='</div>';});h+='</div>';}
  if(ins.recommendations&&ins.recommendations.length){h+='<div class="st" style="margin:1rem 0 8px"><i class="ti ti-list-check" aria-hidden="true"></i> Recomendações</div><div class="recs-list">';ins.recommendations.forEach(function(r){h+='<div class="rec-item"><span class="rec-prio '+(r.priority==='P1'?'p1':r.priority==='P2'?'p2':'p3')+'">'+r.priority+'</span><span class="rec-text">'+r.text+'</span></div>';});h+='</div>';}
  if(ins.gaps&&ins.gaps.length){h+='<div class="st" style="margin:1rem 0 8px"><i class="ti ti-question-mark" aria-hidden="true"></i> Lacunas</div><ul class="gaps-list">';ins.gaps.forEach(function(g){h+='<li>'+g+'</li>';});h+='</ul>';}
  if(ins.next_steps&&ins.next_steps.length){h+='<div class="st" style="margin:1rem 0 8px"><i class="ti ti-arrow-right" aria-hidden="true"></i> Próximos passos</div><ul class="gaps-list">';ins.next_steps.forEach(function(n){h+='<li>'+n+'</li>';});h+='</ul>';}
  document.getElementById('insightsContent').innerHTML=h;
  ['btnCopyMd','btnCopyMd2'].forEach(function(id){const b=document.getElementById(id);if(b)b.style.display='inline-flex';});
}
function renderClusters(clusters){
  const cl=document.getElementById('clustersList');if(!cl||!clusters.length)return;
  cl.innerHTML=clusters.map(function(c){const sc=c.sentiment==='positive'?'sent-pos':c.sentiment==='negative'?'sent-neg':'sent-neu';const sl=c.sentiment==='positive'?'positivo':c.sentiment==='negative'?'negativo':'neutro';const qs=(c.quotes||[]).slice(0,2).map(function(q){return'<div class="cq"><span class="cq-mark">“</span><span>'+q+'</span></div>';}).join('');return'<div class="cluster-card"><div class="cluster-top"><span class="cluster-name">'+c.name+'</span><div class="cluster-meta"><span class="cluster-count">'+c.count+' menções</span><span class="sent-badge '+sc+'">'+sl+'</span></div></div><div class="cluster-quotes">'+qs+'</div></div>';}).join('');
}
function renderMatrix(m){
  [['m-critical','critical',m.critical||[]],['m-watch','watch',m.watch||[]],['m-monitor','monitor',m.monitor||[]],['m-ok','ok',m.ok||[]]].forEach(function(arr){const el=document.getElementById(arr[0]);if(el)el.innerHTML=arr[2].map(function(t){return'<span class="mtag '+arr[1]+'">'+t+'</span>';}).join('');});
}
function togglePresentation(){
  presentationMode=!presentationMode;
  document.getElementById('configBlock').style.display=presentationMode?'none':'block';
  document.getElementById('btnPresent').innerHTML=presentationMode?'<i class="ti ti-presentation-off" aria-hidden="true"></i> Sair':'<i class="ti ti-presentation" aria-hidden="true"></i> Apresentar';
}
function copyShare(){navigator.clipboard.writeText(window.location.href).then(function(){showCopied();});}
function copyMarkdown(){
  const ins=window._lastInsights;if(!ins)return;
  let md='# Síntese da Pesquisa\n\n';
  if(ins.tldr)md+='**TL;DR:** '+ins.tldr+'\n\n';
  if(ins.findings&&ins.findings.length){md+='## Principais achados\n';ins.findings.forEach(function(f,i){md+=(i+1)+'. '+f.title+' — '+f.text+(f.quote?'\n   > "'+f.quote+'"':'')+'\n';});md+='\n';}
  if(ins.recommendations&&ins.recommendations.length){md+='## Recomendações\n';ins.recommendations.forEach(function(r){md+='- ['+r.priority+'] '+r.text+'\n';});md+='\n';}
  if(ins.gaps&&ins.gaps.length){md+='## Lacunas\n';ins.gaps.forEach(function(g){md+='- '+g+'\n';});md+='\n';}
  if(ins.next_steps&&ins.next_steps.length){md+='## Próximos passos\n';ins.next_steps.forEach(function(n){md+='- '+n+'\n';});}
  navigator.clipboard.writeText(md).then(function(){showCopied();});
}
function showCopied(){const el=document.getElementById('copiedMsg');if(!el)return;el.style.display='inline-flex';setTimeout(function(){el.style.display='none';},2000);}
<\/script>
</body>
